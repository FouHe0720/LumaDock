name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build WPF solution
        run: ./scripts/build.ps1

      # Native Shell and visual tests require an interactive Windows desktop.
      # CI runs deterministic component tests, not desktop/performance acceptance.
      - name: Test application and storage contracts
        run: ./scripts/test.ps1

      - name: Test liquid lens pixels
        run: ./scripts/test-lens.ps1

      - name: Test adaptive application layout
        run: ./scripts/test-layout.ps1

      - name: Test adaptive backdrop cadence
        run: ./scripts/test-cadence.ps1

      - name: Publish self-contained Windows package
        run: ./scripts/publish.ps1

      - name: Upload component test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: component-test-reports
          path: artifacts/tests/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v7
        with:
          name: LumaDock-win-x64
          path: artifacts/LumaDock-*-win-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
